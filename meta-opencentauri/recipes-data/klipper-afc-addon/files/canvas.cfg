[include afc.cfg]

[mcu canvas]
serial: /dev/serial/by-path/platform-4200000.usb-usb-0:1.4:1.0
restart_method: command

[drv8833 canvas_lane0]
motor_fwd: canvas:PA6
motor_rwd: canvas:PA5
motor_cycle_time: 0.0001
motor_hall: canvas:PB6
motor_hall_resolution: 0.26242

[drv8833 canvas_lane1]
motor_fwd: canvas:PA7
motor_rwd: canvas:PB0
motor_cycle_time: 0.0001
motor_hall: canvas:PB7
motor_hall_resolution: 0.26242

[drv8833 canvas_lane2]
motor_fwd: canvas:PB8
motor_rwd: canvas:PB9
motor_cycle_time: 0.0001
motor_hall: canvas:PB5
motor_hall_resolution: 0.26242

[drv8833 canvas_lane3]
motor_fwd: canvas:PB1
motor_rwd: canvas:PB10
motor_cycle_time: 0.0001
motor_hall: canvas:PB4
motor_hall_resolution: 0.26242

[board_pins canvas]
mcu: canvas
aliases:
    ENABLE_9V=PC2     , ENABLE_24V=PC3,

    MOTOR0_FWD=PA6    , MOTOR0_RWD=PA5,
    MOTOR1_FWD=PB0    , MOTOR1_RWD=PA7,
    MOTOR2_FWD=PB8    , MOTOR2_RWD=PB9,
    MOTOR3_FWD=PB10   , MOTOR3_RWD=PB1,

    HALL0=PB6         , HALL1=PB7,
    HALL2=PB5         , HALL3=PB4,

    LED0_WHITE=PC9    , LED0_RED=PC8,
    LED1_WHITE=PC6    , LED1_RED=PB15,
    LED2_WHITE=PC10   , LED2_RED=PA15,
    LED3_WHITE=PC1    , LED3_RED=PC12,

    FILAMENT0=PA8     , FILAMENT1=PC7,
    FILAMENT2=PC11    , FILAMENT3=PC0,

    ODOMETER0=PA2     , ODOMETER1=PA3,
    ODOMETER2=PA1     , ODOMETER3=PA0

[AFC_hub toolhead_4way_hub]
switch_pin: !hotend:PB2
enable_hub_runout: False
afc_bowden_length: 8
afc_unload_bowden_length: 45

[AFC_extruder extruder]
pin_tool_start: !hotend:PB2
tool_stn: 43.5
tool_stn_unload: 32
tool_sensor_after_extruder: 0
tool_unload_speed: 15
tool_load_speed: 8

[AFC_canvas CANVAS_1]
extruder: extruder
enable_9v_pin: canvas:ENABLE_9V
enable_24v_pin: canvas:ENABLE_24V
cutter_pin: !hotend:PC5
short_moves_speed: 30
long_moves_speed: 100
prep_distance: 120
prep_speed: 60

[AFC_canvas_lane CANVAS_1]
unit: CANVAS_1:1
hub: toolhead_4way_hub
map: T0
dist_hub: 1200
prep: !canvas:FILAMENT0
drv8833: canvas_lane0
odometer_pin: canvas:ODOMETER0
odometer_resolution: 3.15786
led_white_pin: canvas:LED0_WHITE
led_red_pin: canvas:LED0_RED
disengage_distance: 0.5
enable_hub_runout: True
debounce_delay: 0.2

[AFC_canvas_lane CANVAS_2]
unit: CANVAS_1:2
hub: toolhead_4way_hub
map: T1
dist_hub: 1200
prep: !canvas:FILAMENT1
drv8833: canvas_lane1
odometer_pin: canvas:ODOMETER1
odometer_resolution: 3.15786
led_white_pin: canvas:LED1_WHITE
led_red_pin: canvas:LED1_RED
disengage_distance: 0.5
enable_hub_runout: True
debounce_delay: 0.2

[AFC_canvas_lane CANVAS_3]
unit: CANVAS_1:3
hub: toolhead_4way_hub
map: T2
dist_hub: 1200
prep: !canvas:FILAMENT2
drv8833: canvas_lane2
odometer_pin: canvas:ODOMETER2
odometer_resolution: 3.15786
led_white_pin: canvas:LED2_WHITE
led_red_pin: canvas:LED2_RED
disengage_distance: 0.5
enable_hub_runout: True
debounce_delay: 0.2

[AFC_canvas_lane CANVAS_4]
unit: CANVAS_1:4
hub: toolhead_4way_hub
map: T3
dist_hub: 1200
prep: !canvas:FILAMENT3
drv8833: canvas_lane3
odometer_pin: canvas:ODOMETER3
odometer_resolution: 3.15786
led_white_pin: canvas:LED3_WHITE
led_red_pin: canvas:LED3_RED
disengage_distance: 0.5
enable_hub_runout: True
debounce_delay: 0.2


[gcode_macro POOP]
gcode:
    {% set purge_length = params.PURGE_LENGTH|default(200, true)|float %}

    {% if printer.extruder.target < 180 or not printer.extruder.can_extrude %}
        {action_raise_error("Extruder temperature too low for purging. Please heat the extruder to at least 180°C.")}
    {% endif %}

    {% set rounds = ((purge_length / 100)|round(0, 'ceil'))|int %}
    {% set per_round = (purge_length / rounds) %}

    RESPOND MSG="Purging {purge_length}mm of filament in {rounds} rounds of {per_round}mm each"

    {% for i in range(rounds) %}
        MOVE_TO_TRAY
        #G1 Y250 F12000
        #G4 P500
        #MOVE_TO_TRAY
        M83
        RESPOND TYPE=command MSG="Purging {per_round}mm of filament ({i + 1}/{rounds})"
        G1 Y265 F1200
        G1 E{per_round} F300
        G1 Y264 F1200
        KICK
    {% endfor %}

[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set global = printer['gcode_macro _global_var'] %}
    {% set toolhead_target = printer.extruder.target|int %}
    BED_MESH_CLEAR
    M104 S{global.extruder_temp.cleaning}
    {% if printer.toolhead.homed_axes != "xyz" %}
       G28
    {% endif %}
    G90
    M83

    MOVE_TO_TRAY 
    M109 S{global.extruder_temp.cleaning}

    M106 S255

    ; === Approach ===
    G1 X202 Y264.5 F6000  ; Move to wiper Y position (top of wiper)
    
    ; === Pass 1: X sweeps at top of wiper ===
    G1 X165 F8000    ; Wipe left  (165 vs 170 in old — 5mm wider sweep)
    G1 X190          ; Wipe right
    G1 X165          ; Wipe left
    
    ; === Full depth plunge ===
    G1 Y245 F6000    ; Drop to full depth (19.5mm below top — 5mm deeper than old)

    # TODO: Testing needed. Is this enough cleaning?

    M104 S{toolhead_target}
    M107 
    M400

[gcode_macro KICK]
gcode:
    {% set global = printer['gcode_macro _global_var'] %}
    {% set self = printer["gcode_macro KICK"] %}
    {% set retract_amount = global.retract_amount|float %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("Printer not homed")}
    {% endif %}

    {% if printer.extruder.target < 180 or not printer.extruder.can_extrude %}
        {action_raise_error("Extruder not hot enough to kick")}
    {% endif %}

    G90 ; Absolute positioning
    M83 ; E relative

    MOVE_TO_TRAY ; Move to the tray
    G1 E-{retract_amount} F300 ; Retract slightly to reduce pressure during kick
    M106 S255 ; Full blast fan to solidify plastic
    G4 P2000 ; Wait 2 seconds for fan to do its work

    G1 X202 Y264.5 F6000  ; Move to wiper Y position (top of wiper)
    G1 F8000 ; Set feedrate
    G1 X181 ; Swipe over the v-slot (into)
    G1 X193 ; Swipe over the v-slot (out of)
    G1 X165 ; Wipe left
    G1 X190 ; Wipe right
    G1 X165 ; Wipe left

    M106 S0 ; Turn off fan

    G1 Y250 F6000 ; Exit

    M400 ; Wait for movements to complete

[gcode_button toolhead_front_cover_detection]
pin: hotend:PC4
debounce_delay: 0.5
press_gcode:
    RESPOND TYPE=echo MSG="Front cover has fallen off!"

    {% if printer.print_stats.state == "printing" %}
        PAUSE EMERGENCY=true
    {% endif %}
release_gcode:
    RESPOND TYPE=echo MSG="Front cover has been re-attached"

[gcode_button toolhead_tangle_detection]
pin: !hotend:PB0
debounce_delay: 0.5
press_gcode:
  RESPOND TYPE=echo MSG="Filament tangle detected!"

  {% if printer.print_stats.state == "printing" %}
    PAUSE
  {% endif %}
release_gcode:
  RESPOND TYPE=echo MSG="Filament tangle has been resolved"

[!gcode_macro LOAD_FILAMENT]

[gcode_macro UNLOAD_FILAMENT]
gcode:
    BT_TOOL_UNLOAD

[gcode_macro M600]
gcode:
    {% set tool = params.T|int %}
    {% set purge = params.L|default(0)|float %}

    T{tool} PURGE_LENGTH={purge}

[!filament_switch_sensor filament_sensor]

[AFC]
VarFile: /etc/klipper/config/AFC.var
default_material_type: PLA
enable_sensors_in_gui: True
ignore_spoolman_material_temps: False  
load_to_hub: False
moonraker_port: 80
debug: True
z_hop: 5
resume_speed: 120
resume_z_speed: 25
led_fault: 1,0,0,0              #    Fault color
led_ready: 0,0,0,0.5            #    Ready color
led_not_ready: 1,0,0,0          #    Not ready color
led_loading: 0.2,0,0,0.5        #    Loading color
led_tool_loaded: 1,0,0,1        #    Loaded color
led_buffer_advancing: 0,0,1,0   #    Buffer advancing color
led_buffer_trailing: 0,1,0,0    #    Buffer trailing color
led_buffer_disable: 0,0,0,0.25  #    Buffer disable color
led_spool_illuminate: 1,1,1,0   #    Loading color to illuminate spool, currently only for QuattroBox units and can be overridden in AFC_QuattroBox section
unload_on_runout: True
auto_home: True
enable_assist: False
spool_ratio: 2
enable_hub_runout: False
enable_tool_runout: True
homing_enabled: False
restore_extruder_temp_on_load_or_unload: True
lower_extruder_temp_on_change: False
default_material_temps: default: 240, PLA:210, PETG:240, ABS:260, ASA:260

# TOOL Cutting Settings
tool_cut: True                  
tool_cut_cmd: CUT_FILAMENT
tool_cut_threshold: 10000

# Park Settings
park: True
park_cmd: MOVE_TO_TRAY

# Poop Settings
poop: True                      
poop_cmd: POOP              

# Kick Settings
kick: False
kick_cmd: KICK

# Wipe Settings
wipe: False

# Form Tip Settings
form_tip: False

[extruder]
pulldown_resistor: 100000

[temperature_sensor Mcu_canvas]
sensor_type: temperature_mcu
sensor_mcu: canvas
