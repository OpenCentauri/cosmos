# Canvas RFID -> AFC lanes.
#
# The Canvas has one reader shared by all lanes, so a scan is paired with a lane
# in software: the next lane that is loaded within `window` seconds of a scan
# gets the spool's material, colour, weight and temperature. A dialog also
# offers to apply the scan to a lane directly (e.g. one that is already loaded).
#
# Needs [canvas_rfid <name>] with `tag_gcode: _CANVAS_RFID_ON_TAG`.
# Override any variable below from printer.cfg by redefining it in a
# [gcode_macro _CANVAS_RFID] section.

[gcode_macro _CANVAS_RFID]
description: Canvas RFID lane assignment settings and state
variable_reader: 'canvas_rfid CANVAS_1'
variable_window: 120
variable_prompt: True
variable_beep: True
variable_lanes: ['CANVAS_1', 'CANVAS_2', 'CANVAS_3', 'CANVAS_4']
# State: last scan_id applied (or ignored), and the lane it went to
variable_consumed: 0
variable_applied_lane: ''
variable_prompt_open: False
variable_prompted: ''
gcode:
    RESPOND MSG="Canvas RFID: last scan {printer[reader].scan_id}, applied {consumed} to '{applied_lane}'"

# AFC runs this after every lane prep-load (AFC_unit post_prep_macro)
[gcode_macro AFC_POST_PREP]
description: Apply the last scanned spool to the lane that was just loaded
gcode:
    {% set cfg = printer['gcode_macro _CANVAS_RFID'] %}
    {% if cfg.reader in printer %}
        {% set rfid = printer[cfg.reader] %}
        {% set lane = params.LANE %}
        {% if rfid.filament and rfid.scan_age < cfg.window %}
            {% if rfid.scan_id != cfg.consumed %}
                CANVAS_RFID_APPLY LANE={lane}
            {% elif cfg.applied_lane == lane %}
                # Picked in the dialog before the lane was loaded; loading
                # reset the lane's spool data, so apply it again
                CANVAS_RFID_APPLY LANE={lane}
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro CANVAS_RFID_APPLY]
description: Apply the last scanned spool to an AFC lane
gcode:
    {% set cfg = printer['gcode_macro _CANVAS_RFID'] %}
    {% set rfid = printer[cfg.reader] %}
    {% set f = rfid.filament %}
    {% set lane = params.LANE %}
    {% if not f %}
        RESPOND TYPE=error MSG="Canvas RFID: no spool scanned"
    {% else %}
        SET_COLOR LANE={lane} COLOR={f.color_hex}
        SET_MATERIAL LANE={lane} MATERIAL={f.type}
        {% if f.weight_grams > 0 %}
            SET_WEIGHT LANE={lane} WEIGHT={f.weight_grams}
        {% endif %}
        {% if f.hotend_max_temp_c > 0 %}
            {% set temp = ((f.hotend_min_temp_c + f.hotend_max_temp_c) / 2)|int %}
            {% set bed = " BED_TEMP=%d" % f.bed_temp_c if f.bed_temp_c > 0 else "" %}
            AFC_SET_SPOOL_TEMP LANE={lane} EXTRUDER_TEMP={temp}{bed}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CANVAS_RFID VARIABLE=consumed VALUE={rfid.scan_id}
        SET_GCODE_VARIABLE MACRO=_CANVAS_RFID VARIABLE=applied_lane VALUE="'{lane}'"
        SET_GCODE_VARIABLE MACRO=_CANVAS_RFID VARIABLE=prompt_open VALUE=False
        RESPOND MSG="Canvas RFID: {lane} = {f.manufacturer} {f.type} colour {f.color_hex}"
        RESPOND TYPE=command MSG="action:prompt_end"
    {% endif %}

[gcode_macro CANVAS_RFID_IGNORE]
description: Don't apply the last scanned spool to any lane
gcode:
    {% set cfg = printer['gcode_macro _CANVAS_RFID'] %}
    SET_GCODE_VARIABLE MACRO=_CANVAS_RFID VARIABLE=consumed VALUE={printer[cfg.reader].scan_id}
    SET_GCODE_VARIABLE MACRO=_CANVAS_RFID VARIABLE=applied_lane VALUE="''"
    SET_GCODE_VARIABLE MACRO=_CANVAS_RFID VARIABLE=prompt_open VALUE=False
    RESPOND TYPE=command MSG="action:prompt_end"

# tag_gcode target: runs after every new tag read
[gcode_macro _CANVAS_RFID_ON_TAG]
gcode:
    {% set cfg = printer['gcode_macro _CANVAS_RFID'] %}
    {% set f = printer[cfg.reader].filament %}
    # Elegoo spools have a tag on each side with the same data: don't beep
    # or reopen the dialog for the other side of the spool already shown
    {% set repeat = f and cfg.prompt_open and f.unique_id == cfg.prompted %}
    # M300 dwells with G4, which would stall motion mid-print
    {% if f and not repeat and cfg.beep and printer.print_stats.state != 'printing' %}
        BEEP_SUCCESS TARGET=canvas
    {% endif %}
    {% if f and cfg.prompt and not repeat %}
        SET_GCODE_VARIABLE MACRO=_CANVAS_RFID VARIABLE=prompt_open VALUE=True
        SET_GCODE_VARIABLE MACRO=_CANVAS_RFID VARIABLE=prompted VALUE="'{f.unique_id}'"
        RESPOND TYPE=command MSG="action:prompt_begin Spool scanned"
        RESPOND TYPE=command MSG="action:prompt_text {f.manufacturer} {f.type} colour {f.color_hex}. Load it into a lane within {cfg.window} s, or apply it to:"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% for lane in cfg.lanes %}
            RESPOND TYPE=command MSG="action:prompt_button {lane}|CANVAS_RFID_APPLY LANE={lane}|primary"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_footer_button Ignore|CANVAS_RFID_IGNORE|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}
