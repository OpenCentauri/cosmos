[include afc.cfg]

[AFC]
global_print_current: 0.6
load_to_hub: True
assisted_unload: True
error_timeout: 36000

led_name: AFC_Indicator         # LED name from the [AFC_led] section in AFC_Hardware.cfg.
led_fault: 1,0,0,0              # Fault color             (R,G,B,W) 0 = off, 1 = full brightness.
led_ready: 0,0.8,0,0            # Ready color             (R,G,B,W) 0 = off, 1 = full brightness.
led_not_ready: 1,0,0,0          # Not ready color         (R,G,B,W) 0 = off, 1 = full brightness.
led_loading: 1,1,1,0            # Loading color           (R,G,B,W) 0 = off, 1 = full brightness.
led_tool_loaded: 0,0,1,0        # Loaded color            (R,G,B,W) 0 = off, 1 = full brightness.
led_buffer_advancing: 0,0,1,0   # Buffer advancing color  (R,G,B,W) 0 = off, 1 = full brightness.
led_buffer_trailing: 0,1,0,0    # Buffer trailing color   (R,G,B,W) 0 = off, 1 = full brightness.
led_buffer_disable: 0,0,0,0.25  # Buffer disable color    (R,G,B,W) 0 = off, 1 = full brightness.
led_spool_illuminate: 1,1,1,0   # Loading color           (R,G,B,W) 0 = off, 1 = full brightness.

# TODO: This currently requires the canvas board, we should make this state agnostic
[AFC_extruder extruder]
# pin_tool_start: buffer
pin_tool_start: !hotend:PB2
tool_stn: 53.5
tool_stn_unload: 42.0 
tool_sensor_after_extruder: 0.0
tool_unload_speed: 25
tool_load_speed: 25

[board_pins Turtle_1]
mcu: Turtle_1
aliases:
    M1_STEP=PD4    	, M1_DIR=PD3    , M1_EN=PD6   	, M1_UART=PD5   , # M1_DIAG=PD2   ,
    M2_STEP=PC12   	, M2_DIR=PC11   , M2_EN=PD1   	, M2_UART=PD0   , # M2_DIAG=PC10  ,
    M3_STEP=PE2    	, M3_DIR=PE3    , M3_EN=PE0   	, M3_UART=PE1   , # M3_DIAG=PE4   ,
    M4_STEP=PD15   	, M4_DIR=PD14   , M4_EN=PC7   	, M4_UART=PC6   , # M4_DIAG=PC8   ,

    # suggested switch pin configurations
    HUB=PC4 		, 
    TRG1=PC5  		, TRG2=PB0  	, TRG3=PB1 		, TRG4=PB2		,
    EXT1=PE8 		, EXT2=PE9  	, EXT3=PE10		, EXT4=PE11		,
    TN_ADV=PE13     , TN_TRL=PE12   ,
    # alternate names for endstop ports
    SW1=PC4 		, SW2=PC5 	, SW3=PB0  	, SW4=PB1 	, SW5=PB2	, SW6=PE7	,
    SW7=PE8 		, SW8=PE9	, SW9=PE10	, SW10=PE11	, SW11=PE12	, SW12=PE13	,
    # Uncomment PSF define below for PSF sensor, since the ADC pins are the Trigger pins you need
    # to rearrange your connectors and config. Easiest thing do change would be to
    # user the hub pin for the PSF sensor and then put the hub on either the turtleneck
    # trailing/advancing connector. Make sure this config is updated to reflect your changes.
    #
    # The following pins are all ADC pins on the AFC-Lite board
    # SW1(PC4), SW2(PC5), SW3(PB0), SW4(PB1) 
    #PSF=PC4,
    
	
    MOT1_RWD=PA0	, MOT1_FWD=PA1	, MOT1_EN=PA2	,
    MOT2_RWD=PA6	, MOT2_FWD=PA7	, MOT2_EN=PA5	,
    MOT3_RWD=PB14	, MOT3_FWD=PB15	, MOT3_EN=PB13	,
    MOT4_RWD=PD12	, MOT4_FWD=PD13	, MOT4_EN=PD11	,
	
    RGB1=PE14		, RGB2=PE15	    , RGB3=PB10	    , RGB4=PB11		,

[mcu Turtle_1]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_30001F000C51333033333834-if00

[AFC_BoxTurtle Turtle_1]
hub: Turtle_1
extruder: extruder
enable_assist: True        # Setting to True enables espooler assist while printing
enable_kick_start: True    # Setting to True enables full speed espoolers for kick_start_time(0.070 ms default) amount
buffer: Turtle_1

[temperature_sensor Turtle_1]
sensor_type: temperature_mcu
sensor_mcu: Turtle_1

[AFC_stepper lane1]
unit: Turtle_1:1
step_pin: Turtle_1:M1_STEP
dir_pin: !Turtle_1:M1_DIR
enable_pin: !Turtle_1:M1_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 139.03 
park_dist: 10
led_index: AFC_Indicator:1
afc_motor_rwd: Turtle_1:MOT1_RWD
afc_motor_fwd: Turtle_1:MOT1_FWD
afc_motor_enb: Turtle_1:MOT1_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!Turtle_1:TRG1
load: ^Turtle_1:EXT1

[tmc2209 AFC_stepper lane1]
uart_pin: Turtle_1:M1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane2]
unit: Turtle_1:2
step_pin: Turtle_1:M2_STEP
dir_pin: !Turtle_1:M2_DIR
enable_pin: !Turtle_1:M2_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 76.09 
park_dist: 10
led_index: AFC_Indicator:2
afc_motor_rwd: Turtle_1:MOT2_RWD
afc_motor_fwd: Turtle_1:MOT2_FWD
afc_motor_enb: Turtle_1:MOT2_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!Turtle_1:TRG2
load: ^Turtle_1:EXT2

[tmc2209 AFC_stepper lane2]
uart_pin: Turtle_1:M2_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane3]
unit: Turtle_1:3
step_pin: Turtle_1:M3_STEP
dir_pin: !Turtle_1:M3_DIR
enable_pin: !Turtle_1:M3_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 75.0 
park_dist: 10
led_index: AFC_Indicator:3
afc_motor_rwd: Turtle_1:MOT3_RWD
afc_motor_fwd: Turtle_1:MOT3_FWD
afc_motor_enb: Turtle_1:MOT3_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!Turtle_1:TRG3
load: ^Turtle_1:EXT3

[tmc2209 AFC_stepper lane3]
uart_pin: Turtle_1:M3_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane4]
unit: Turtle_1:4
step_pin: Turtle_1:M4_STEP
dir_pin: !Turtle_1:M4_DIR
enable_pin: !Turtle_1:M4_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 138.92 
park_dist: 10
led_index: AFC_Indicator:4
afc_motor_rwd: Turtle_1:MOT4_RWD
afc_motor_fwd: Turtle_1:MOT4_FWD
afc_motor_enb: Turtle_1:MOT4_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!Turtle_1:TRG4
load: ^Turtle_1:EXT4

[tmc2209 AFC_stepper lane4]
uart_pin: Turtle_1:M4_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_hub Turtle_1]
switch_pin: ^Turtle_1:HUB   # Pin for the hub switch
afc_bowden_length: 1353.23  # Length of the Bowden tube from the hub to the toolhead sensor in mm.
afc_unload_bowden_length: 1353.23 
move_dis: 75                # Distance to move the filament within the hub in mm.
cut: False                  # Hub cutter installed (e.g. Snappy)

#--=================================================================================--#
######### Hub Cut #####################################################################
#--=================================================================================--#
assisted_retract: False     # If True, retracts are assisted to prevent loose windows on the spool
cut_cmd: AFC #CMD to use
cut_dist: 50                # How much filament to cut off (in mm).
cut_clear: 120              # How far the filament should retract back from the hub (in mm).
cut_min_length: 300.0
cut_servo_pass_angle: 10    # Servo angle to align the Bowden tube with the hole for loading the toolhead.
cut_servo_clip_angle: 180   # Servo angle for cutting the filament.
cut_servo_prep_angle: 80    # Servo angle to prepare the filament for cutting (aligning the exit hole).

[AFC_led AFC_Indicator]
pin: Turtle_1:RGB1
chain_count: 4
color_order: GRBW

[AFC_buffer Turtle_1]
advance_pin: ^Turtle_1:TN_ADV    # set advance pin
trailing_pin: ^Turtle_1:TN_TRL  # set trailing pin
multiplier_high: 1.05   # default 1.05, factor to feed more filament
multiplier_low:  0.95   # default 0.95, factor to feed less filament