# UPDATES WILL RESET THIS FILE. YOUR EDITS WILL BE LOST WHEN UPDATING.
# -----

[include afc.cfg]
[include canvas-toolhead.cfg]

[gcode_macro _AFC_GLOBAL_VARS]
variable_stepper_name: 'CANVAS_'

[mcu canvas]
serial: /dev/ttyS1
baud: 250000
restart_method: command

[drv8833 canvas_lane0]
motor_fwd: canvas:MOTOR0_FWD
motor_rwd: canvas:MOTOR0_RWD
motor_cycle_time: 0.0001
motor_hall: canvas:HALL0
motor_hall_resolution: 0.26242

[drv8833 canvas_lane1]
motor_fwd: canvas:MOTOR1_FWD
motor_rwd: canvas:MOTOR1_RWD
motor_cycle_time: 0.0001
motor_hall: canvas:HALL1
motor_hall_resolution: 0.26242

[drv8833 canvas_lane2]
motor_fwd: canvas:MOTOR2_FWD
motor_rwd: canvas:MOTOR2_RWD
motor_cycle_time: 0.0001
motor_hall: canvas:HALL2
motor_hall_resolution: 0.26242

[drv8833 canvas_lane3]
motor_fwd: canvas:MOTOR3_FWD
motor_rwd: canvas:MOTOR3_RWD
motor_cycle_time: 0.0001
motor_hall: canvas:HALL3
motor_hall_resolution: 0.26242

[board_pins canvas]
mcu: canvas
aliases:
    MOTOR0_FWD=PA1    , MOTOR0_RWD=PA0,
    MOTOR1_FWD=PA2    , MOTOR1_RWD=PA3,
    MOTOR2_FWD=PA7    , MOTOR2_RWD=PA6,
    MOTOR3_FWD=PB1    , MOTOR3_RWD=PB0,

    MOTOR01_FAULT=PC1 , MOTOR23_FAULT=PC2,

    HALL0=PA10        , HALL1=PA8,
    HALL2=PA11        , HALL3=PA9,

    LED0_WHITE=PC3    , LED0_RED=PB3,
    LED1_WHITE=PB9    , LED1_RED=PB5,
    LED2_WHITE=PC0    , LED2_RED=PB8,
    LED3_WHITE=PD2    , LED3_RED=PC12,

    FILAMENT0=PB14    , FILAMENT1=PB15,
    FILAMENT2=PB12    , FILAMENT3=PB13,

    ODOMETER0=PC8     , ODOMETER1=PC6,
    ODOMETER2=PC9     , ODOMETER3=PC7

[AFC_hub toolhead_4way_hub]
switch_pin: !hotend:PB1
enable_hub_runout: False
afc_bowden_length: 8
afc_unload_bowden_length: 45

[AFC_extruder extruder]
pin_tool_start: !hotend:PB1
tool_stn: 43.5
tool_stn_unload: 32
tool_sensor_after_extruder: 0
tool_unload_speed: 15
tool_load_speed: 8

[AFC_canvas CANVAS_1]
extruder: extruder
cutter_pin: !hotend:PA2
short_moves_speed: 30
long_moves_speed: 100
prep_distance: 120
eject_distance: 100
prep_speed: 60

[AFC_canvas_lane CANVAS_1]
unit: CANVAS_1:1
hub: toolhead_4way_hub
map: T0
dist_hub: 1200
prep: !canvas:FILAMENT0
drv8833: canvas_lane0
odometer_pin: canvas:ODOMETER0
odometer_resolution: 3.15786
led_white_pin: canvas:LED0_WHITE
led_red_pin: canvas:LED0_RED
disengage_distance: 0.5
enable_hub_runout: True
debounce_delay: 0.2

[AFC_canvas_lane CANVAS_2]
unit: CANVAS_1:2
hub: toolhead_4way_hub
map: T1
dist_hub: 1200
prep: !canvas:FILAMENT1
drv8833: canvas_lane1
odometer_pin: canvas:ODOMETER1
odometer_resolution: 3.15786
led_white_pin: canvas:LED1_WHITE
led_red_pin: canvas:LED1_RED
disengage_distance: 0.5
enable_hub_runout: True
debounce_delay: 0.2

[AFC_canvas_lane CANVAS_3]
unit: CANVAS_1:3
hub: toolhead_4way_hub
map: T2
dist_hub: 1200
prep: !canvas:FILAMENT2
drv8833: canvas_lane2
odometer_pin: canvas:ODOMETER2
odometer_resolution: 3.15786
led_white_pin: canvas:LED2_WHITE
led_red_pin: canvas:LED2_RED
disengage_distance: 0.5
enable_hub_runout: True
debounce_delay: 0.2

[AFC_canvas_lane CANVAS_4]
unit: CANVAS_1:4
hub: toolhead_4way_hub
map: T3
dist_hub: 1200
prep: !canvas:FILAMENT3
drv8833: canvas_lane3
odometer_pin: canvas:ODOMETER3
odometer_resolution: 3.15786
led_white_pin: canvas:LED3_WHITE
led_red_pin: canvas:LED3_RED
disengage_distance: 0.5
enable_hub_runout: True
debounce_delay: 0.2

[gcode_macro _global_var]
variable_runout_sensor_name: 'filament_switch_sensor extruder_tool_start'

[!filament_switch_sensor filament_sensor]

[AFC]
load_to_hub: False
led_fault: 1,0,0,0              #    Fault color
led_ready: 0,0,0,0.5            #    Ready color
led_not_ready: 1,0,0,0          #    Not ready color
led_loading: 0.2,0,0,0.5        #    Loading color
led_tool_loaded: 1,0,0,1        #    Loaded color
led_buffer_advancing: 0,0,1,0   #    Buffer advancing color
led_buffer_trailing: 0,1,0,0    #    Buffer trailing color
led_buffer_disable: 0,0,0,0.25  #    Buffer disable color
led_spool_illuminate: 1,1,1,0   #    Loading color to illuminate spool, currently only for QuattroBox units and can be overridden in AFC_QuattroBox section
enable_assist: False
spool_ratio: 2
enable_hub_runout: False
enable_tool_runout: True
homing_enabled: False
clear_spool_after_eject: False

[pwm_cycle_time BEEPER_canvas]
pin: canvas:PC15
