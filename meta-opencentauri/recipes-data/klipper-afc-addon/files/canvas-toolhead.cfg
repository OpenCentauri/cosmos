[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set global = printer['gcode_macro _global_var'] %}
    {% set pre_toolhead_target = printer.extruder.target|int %}
    {% set target = params.TARGET|default(global.extruder_temp.cleaning if pre_toolhead_target < global.extruder_temp.cleaning else pre_toolhead_target)|int %}
    {% set self = printer["gcode_macro KICK"] %}
    {% set retract_amount = global.retract_amount|float %}
    {% set with_retract = params.RETRACT|default('false')|lower == 'true' %}
    
    M104 S{target}
    _CG28 AXIS=XY
    G90
    M83

    MOVE_TO_TRAY
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target} MAXIMUM={target+5}

    {% if with_retract %}
        G1 E-{retract_amount} F300 ; Retract slightly to reduce pressure
    {% endif %}
    M106 S255 ; Full blast fan to solidify plastic
    G4 P2000 ; Wait 2 seconds for fan to do its work

    G1 X202 Y264.5 F6000  ; Move to wiper Y position (top of wiper)
    G1 F8000 ; Set feedrate
    G1 X181 ; Swipe over the v-slot (into)
    G1 X193 ; Swipe over the v-slot (out of)

    {% if with_retract %}
        G1 E{retract_amount} F300 ; Unretract
    {% endif %}

    G1 F8000 ; Set feedrate
    G1 X165 ; Wipe left
    G1 X190 ; Wipe right
    G1 X165 ; Wipe left

    M104 S{pre_toolhead_target}
    G1 Y250 F6000 ; Exit
    M107 ; Turn off fan
    M400 ; Wait for movements to complete

[gcode_macro KICK]
variable_end_kick_x: 181

[gcode_button toolhead_front_cover_detection]
pin: hotend:PC4
debounce_delay: 0.5
press_gcode:
    RESPOND TYPE=echo MSG="Front cover has fallen off!"

    {% if printer.print_stats.state == "printing" %}
        PAUSE EMERGENCY=true
    {% endif %}
release_gcode:
    RESPOND TYPE=echo MSG="Front cover has been re-attached"

[gcode_button toolhead_tangle_detection]
pin: !hotend:PB0
debounce_delay: 0.5
press_gcode:
  {% set settings = printer["gcode_macro _COSMOS_SETTINGS"]|default({}) %}
  {% set enabled = settings.tangle_detection|default('true')|lower == 'true' %}

  {% if not enabled %}
    RESPOND TYPE=echo MSG="Filament tangle switch triggered, ignored (tangle_detection is off)"
  {% else %}
    RESPOND TYPE=echo MSG="Filament tangle detected!"

    {% if printer.print_stats.state == "printing" %}
      PAUSE
    {% endif %}
  {% endif %}
release_gcode:
  RESPOND TYPE=echo MSG="Filament tangle has been resolved"

[extruder]
pulldown_resistor: 100000
