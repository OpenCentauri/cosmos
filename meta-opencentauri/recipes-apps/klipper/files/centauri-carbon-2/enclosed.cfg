[fan_generic aux_fan]
pin: PD15
tachometer_pin: PD14

[fan_generic case_fan]
pin: PD17
tachometer_pin: PD16

[servo case_servo]
pin: PB7
initial_angle: 90.0

[led case]
white_pin: PB5
initial_WHITE: 1

[temperature_sensor chamber]
sensor_pin: PB13
sensor_type: NTC 100K beta 3950
pullup_resistor: 22000
min_temp: 0
max_temp: 80

[gcode_button case_servo_sensor]
pin: PB2
press_gcode:
    UPDATE_DELAYED_GCODE ID=case_servo_timeout DURATION=0
    G4 P400 ; We have no way to detect when the fan cover is fully open. Instead, the sensor triggers somewhere halfway, and around 400ms is needed to fully open it.
    SET_SERVO SERVO=case_servo ANGLE=90
release_gcode:
    UPDATE_DELAYED_GCODE ID=case_servo_timeout DURATION=0
    SET_SERVO SERVO=case_servo ANGLE=90

[delayed_gcode case_servo_timeout]
gcode:
    SET_SERVO SERVO=case_servo ANGLE=90
    RESPOND TYPE=error MSG="Servo timeout: sensor did not change"

[gcode_macro EXHAUST_OPEN]
gcode:
    {% if printer["gcode_button case_servo_sensor"].state == "PRESSED" %} ; Currently closed
        RESPOND MSG="Opening exhaust cover"
        UPDATE_DELAYED_GCODE ID=case_servo_timeout DURATION=5
        SET_SERVO SERVO=case_servo ANGLE=135
    {% endif %}

[gcode_macro EXHAUST_CLOSE]
gcode:
    {% if printer["gcode_button case_servo_sensor"].state == "RELEASED" %} ; Currently open
        RESPOND MSG="Closing exhaust cover"
        UPDATE_DELAYED_GCODE ID=case_servo_timeout DURATION=5
        SET_SERVO SERVO=case_servo ANGLE=45
    {% endif %}