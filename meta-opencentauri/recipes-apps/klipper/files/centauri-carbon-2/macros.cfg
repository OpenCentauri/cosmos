# -----
# PLEASE DO NOT EDIT THIS FILE. EDIT printer.cfg INSTEAD.
# UPDATES WILL RESET THIS FILE. YOUR EDITS WILL BE LOST WHEN UPDATING.
# -----

[gcode_macro _global_var]
variable_always_kick_during_purge: True

[gcode_macro M6211]
gcode:
    { action_emergency_stop("Use COSMOS OrcaSlicer profile (or COSMOS start/end machine gcode).") }

[gcode_macro G180]
gcode:
    { action_emergency_stop("Use COSMOS OrcaSlicer profile (or COSMOS start/end machine gcode).") }

[gcode_macro MOVE_TO_TRAY]
gcode:
    _CG28 AXIS=XY

    {% if printer.gcode_move.position.x > 52 and printer.gcode_move.position.x < 53 and printer.gcode_move.position.y > 263.5 and printer.gcode_move.position.y < 264.5 and "xy" in printer.toolhead.homed_axes %}
        RETURN ; Already at the tray
    {% endif %}

    G90                             ; Absolute positioning
    G0 X52.5 F20000
    G0 Y255 F20000             ; Move near to the try
    G0 Y264 F1200                 ; Move slowly back to the tray

    M400                            ; Wait for movements to complete

[gcode_macro KICK]
gcode:
    {% set global = printer['gcode_macro _global_var'] %}
    {% set retract_amount = global.retract_amount|float %}

    {% if "xy" not in printer.toolhead.homed_axes %}
        {action_raise_error("Printer not homed")}
    {% endif %}

    {% if printer.extruder.target < 180 or not printer.extruder.can_extrude %}
        {action_raise_error("Extruder not hot enough to kick")}
    {% endif %}

    G90 ; Absolute positioning
    M83 ; E relative

    MOVE_TO_TRAY ; Move to the tray
    G1 E-{retract_amount} F300 ; Retract slightly to reduce pressure during kick
    M106 S255 ; Full blast fan to solidify plastic
    G4 P2000 ; Wait 2 seconds for fan to do its work
  	G1 Y258 F10000
	G4 P200
	G0 Y264 F1200
	G1 Y255 F8000 ; Move back into print
	M107

    M400 ; Wait for movements to complete

[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set global = printer['gcode_macro _global_var'] %}
    {% set pre_toolhead_target = printer.extruder.target|int %}
    {% set target = params.TARGET|default(global.extruder_temp.cleaning if pre_toolhead_target < global.extruder_temp.cleaning else pre_toolhead_target)|int %}
    {% set retract_amount = global.retract_amount|float %}
    {% set with_retract = params.RETRACT|default('false')|lower == 'true' %}
    
    M104 S{target}
    _CG28 AXIS=XY
    G90
    M83

    MOVE_TO_TRAY
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target} MAXIMUM={target+5}

    {% if with_retract %}
        G1 E-{retract_amount} F300 ; Retract slightly to reduce pressure
    {% endif %}
    M106 S255 ; Full blast fan to solidify plastic
    G4 P2000 ; Wait 2 seconds for fan to do its work

	G1 X64 Y264 F1200 ; Ensure to be at the right position
	G1 F8000

	{% for _ in range(3) %}
		G1 X64
		G1 X80
	{% endfor %}

	M104 S{pre_toolhead_target}

	G1 Y255 ; Exit
	M107

    M400 ; Wait for movements to complete
