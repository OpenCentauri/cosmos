# -----
# PLEASE DO NOT EDIT THIS FILE. EDIT printer.cfg INSTEAD.
# UPDATES WILL RESET THIS FILE. YOUR EDITS WILL BE LOST WHEN UPDATING.
# -----

[gcode_shell_command START_DOOM]
command: play-doom
timeout: 9999999
verbose: False

[gcode_macro DOOM]
gcode:
    RUN_SHELL_COMMAND CMD=START_DOOM

[gcode_shell_command CAMERA_START]
command: /etc/init.d/ustreamer start
timeout: 5
verbose: False

[gcode_shell_command CAMERA_STOP]
command: /etc/init.d/ustreamer stop
timeout: 5
verbose: False

[gcode_shell_command GUI_START]
command: /etc/init.d/gui-switcher start
timeout: 5
verbose: False

[gcode_shell_command GUI_STOP]
command: /etc/init.d/gui-switcher stop
timeout: 5
verbose: False

[gcode_shell_command REBOOT_SYSTEM]
command: reboot
timeout: 5
verbose: False

[gcode_macro REBOOT_MACHINE]
gcode:
    RUN_SHELL_COMMAND CMD=REBOOT_SYSTEM

[gcode_shell_command CHECK_FOR_UPDATES]
command: check-update
timeout: 5
verbose: False

[gcode_shell_command UPDATE_COSMOS]
command: update-cosmos
timeout: 500
verbose: False

[gcode_macro _UPDATE_COSMOS]
gcode:
    _SHOW_PROMPT TITLE="Updating..." MESSAGE="Please wait while COSMOS is updated. This may take a few minutes."
    RUN_SHELL_COMMAND CMD=UPDATE_COSMOS

[delayed_gcode check_for_updates_startup]
initial_duration: 60
gcode:
    {% if printer.idle_timeout.state in ["Idle", "Ready"] and printer.print_stats.state == "standby" %}
        RUN_SHELL_COMMAND CMD=CHECK_FOR_UPDATES
    {% endif %}

[gcode_shell_command CHECK_DISK]
command: check-disk
timeout: 5
verbose: True

[delayed_gcode check_disk_startup]
initial_duration: 60
gcode:
        RUN_SHELL_COMMAND CMD=CHECK_DISK


