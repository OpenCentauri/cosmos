# -----
# PLEASE DO NOT EDIT THIS FILE. EDIT printer.cfg INSTEAD.
# UPDATES WILL RESET THIS FILE. YOUR EDITS WILL BE LOST WHEN UPDATING.
# -----

[mcu]
serial: /dev/ttyRPMSG0
restart_method: command

[mcu bed]
serial: /dev/ttyS0
baud: 500000
restart_method: command
is_non_critical: true

[mcu hotend]
serial: /dev/ttyS3
baud: 250000
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 20000
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 9

# kinematics: limited_corexy
# max_x_accel:10000
# max_y_accel:5000
# max_velocity: 500


[gcode_arcs]
resolution: 0.5

[pause_resume]

[exclude_object]

[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 1800

[virtual_sdcard]
path: /etc/klipper/gcodes

[danger_options]
multi_mcu_trsync_timeout: 0.03

[stepper_x]
step_pin: PG18
dir_pin: !PF1
enable_pin: !PF6
endstop_pin: tmc2209_stepper_x:virtual_endstop
microsteps: 16
full_steps_per_rotation: 200
position_endstop: 256
position_max: 256
position_min: -2
homing_speed: 80
homing_retract_dist: 20
rotation_distance: 39.872
homing_accel:5000

[tmc2209 stepper_x]
tx_pin: PE7
uart_pin: PE6
uart_address: 0
interpolate: true
run_current: 1
home_current: 0.8
sense_resistor: 0.1
coolstep_threshold: 29.904
driver_MULTISTEP_FILT: true
driver_IHOLDDELAY: 12
driver_TBL: 1
driver_TOFF: 1
driver_HSTRT: 2
driver_HEND: 3
driver_PWM_AUTOSCALE: true
driver_PWM_AUTOGRAD: true
driver_PWM_FREQ: 2
driver_PWM_GRAD: 15
driver_PWM_OFS: 18
driver_PWM_REG: 15
driver_PWM_LIM: 4
driver_SEMIN: 2
driver_SEMAX: 4
driver_SEUP: 3
driver_SEDN: 2
driver_SEIMIN: 1
driver_SGTHRS: 130
diag_pin: PF0

[stepper_y]
step_pin: PG16
dir_pin: !PG17
enable_pin: !PE15
endstop_pin: tmc2209_stepper_y:virtual_endstop
microsteps: 16
full_steps_per_rotation: 200
position_endstop: -2
position_max: 265
position_min: -2
homing_speed: 80
homing_retract_dist: 30
rotation_distance: 39.872
homing_accel:5000

[tmc2209 stepper_y]
tx_pin: PE7
uart_pin: PE6
interpolate: true
run_current: 1.0
home_current: 0.8
uart_address: 3
sense_resistor: 0.1
coolstep_threshold: 29.904
driver_MULTISTEP_FILT: true
driver_IHOLDDELAY: 12
driver_TBL: 1
driver_TOFF: 1
driver_HSTRT: 2
driver_HEND: 3
driver_PWM_AUTOSCALE: true
driver_PWM_AUTOGRAD: true
driver_PWM_FREQ: 2
driver_PWM_GRAD: 15
driver_PWM_OFS: 18
driver_PWM_REG: 15
driver_PWM_LIM: 4
driver_SEMIN: 2
driver_SEMAX: 4
driver_SEUP: 3
driver_SEDN: 2
driver_SEIMIN: 1
driver_SGTHRS: 130
diag_pin: PF3

[stepper_z]
step_pin: PE16
dir_pin: !PF5
enable_pin: !PE12
endstop_pin: ^PB10
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200
position_endstop: 4
position_max: 258
position_min: -4
homing_speed: 8
homing_retract_dist: 10
homing_retract_speed: 6
second_homing_speed: 2

[tmc2209 stepper_z]
tx_pin: PE7
uart_pin: PE6
interpolate: true
run_current: 0.8
uart_address: 1
sense_resistor: 0.1
stealthchop_threshold: 99999
coolstep_threshold: 6.0
driver_MULTISTEP_FILT: true
driver_IHOLDDELAY: 12
driver_TBL: 1
driver_TOFF: 1
driver_HSTRT: 0
driver_HEND: 2
driver_PWM_AUTOSCALE: true
driver_PWM_AUTOGRAD: true
driver_PWM_FREQ: 2
driver_PWM_GRAD: 15
driver_PWM_OFS: 36
driver_PWM_REG: 15
driver_PWM_LIM: 4
driver_SEMIN: 2
driver_SEMAX: 4
driver_SEUP: 3
driver_SEDN: 2
driver_SEIMIN: 1
driver_SGTHRS: 40
diag_pin: PE14

[extruder]
step_pin: hotend:PB5
dir_pin: hotend:PB6
enable_pin: !hotend:PB7
heater_pin: hotend:PB8
sensor_pin: hotend:PA3
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 52:10
rotation_distance: 28.8 #could be 27.3 needs more testing 28.8 default
nozzle_diameter: 0.4
filament_diameter: 1.75
sensor_type: hotend_thermistor
smooth_time: 1.5
min_temp: 0
max_temp: 335
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time: 0.04
max_extrude_only_distance: 500 #was 150, for purging
max_extrude_cross_section: 5
control: pid
pid_Kp: 24.860427
pid_Ki: 2.702253
pid_Kd: 57.178292

[tmc2209 extruder]
tx_pin: hotend:PC6 # Todo (james): this isn't correct!
uart_pin: hotend:PB11
interpolate: true
run_current: 0.7
uart_address: 2
sense_resistor: 0.1
coolstep_threshold: 21.6
driver_MULTISTEP_FILT: true
driver_IHOLDDELAY: 12
driver_TBL: 1
driver_TOFF: 1
driver_HSTRT: 7
driver_HEND: 9
driver_PWM_AUTOSCALE: true
driver_PWM_AUTOGRAD: true
driver_PWM_FREQ: 2
driver_PWM_GRAD: 4
driver_PWM_OFS: 22
driver_PWM_REG: 15
driver_PWM_LIM: 4
driver_SEMIN: 2
driver_SEMAX: 4
driver_SEUP: 3
driver_SEDN: 2
driver_SEIMIN: 1
driver_SGTHRS: 40

[verify_heater extruder]

# Todo (james): this isn't correct!
[thermistor hotend_thermistor]
temperature1: 25
resistance1: 100000
beta: 4300

[heater_fan extruder]
pin: hotend:PB13
tachometer_pin: hotend:PB14
tachometer_poll_interval: 0.001

[fan]
pin: hotend:PA8
tachometer_pin: hotend:PB15
tachometer_ppr: 2
tachometer_poll_interval: 0.001


[lis2dw]
spi_speed: 5000000
cs_pin: hotend:PA4
spi_bus: spi1
axes_map: x,y,z

[input_shaper]
damping_ratio_x: 0.06
damping_ratio_y: 0.082

[resonance_tester]
probe_points: 128,128,20
accel_chip: lis2dw
min_freq: 10
max_freq: 100
accel_per_hz: 100
hz_per_sec: 2


[heater_bed]
heater_pin: PG13
sensor_pin: PB14
sensor_type: Generic 3950
min_temp: 0
max_temp: 125
control: pid
pid_Kp: 46.504839
pid_Ki: 1.453276
pid_Kd: 372.038710

[verify_heater heater_bed]

[bed_mesh]
speed: 150
horizontal_move_z: 2
mesh_min: 10,10
mesh_max: 246,246
probe_count: 9,9
mesh_pps: 3,3
algorithm: bicubic
adaptive_margin: 3
zero_reference_position: 128, 128
move_check_distance: 3.0
split_delta_z: 0.01
horizontal_z_clearance: 0.4

[load_cell_probe]
sensor_type: cs1237
dout_pin: bed:PA5
sclk_pin: bed:PA4
sample_rate: 1280
gain: 128
speed: 2.0
sample_retract_dist: 0.5
lift_speed: 10.0
counts_per_gram: 105
reference_tare_counts: 71000
z_offset: 0.0
pullback_distance: 0.4
pullback_speed: 1.0
samples_tolerance: 0.05
samples_tolerance_retries: 3

