# Knock gestures for the Centauri Carbon (COSMOS). Idle printer only. One command:
#
#   KNOCK                                   list recorded patterns, tempo, on/off (same as LIST=1)
#   KNOCK ENABLED=0 | ENABLED=1             feature off / on (persists; off = no polling, chip powered down)
#   KNOCK CALIBRATE=1                       learn your knock tempo (5 quick knocks twice, then 3 with pauses)
#   KNOCK RECORD=1 NAME=x MACRO=<gcode>     knock a pattern, knock it again to confirm, bind it to a macro
#   KNOCK RECORD=1 NAME=x PARROT=1          ...to parrot mode (toolhead replays your rhythm from the bed centre)
#   KNOCK RECORD=1 NAME=x PRINT="text"      ...to a console message; PRINT combines with MACRO or PARROT
#   KNOCK DELETE=x                          remove a recorded pattern
#   KNOCK REMIND=x                          forgot a pattern? the toolhead plays it back and the console shows it
#
# A macro with arguments needs quotes: MACRO="M117 hello". Patterns match by the proportions of the gaps
# between knocks, so knocking faster or slower still works. Double tap toggles the lights by default.

[knock]
accel_chip: lis2dw
#threshold: 0.06        # g; default is the chip floor (62.5 mg). Raise if fans or a neighbour trigger it.
#odr: 1600              # 400 | 800 | 1600
#poll_hz: 20
#echo: True             # console line for every knock group
#verbose: False         # log gaps for every group to klippy.log
#tolerance: 0.35        # how far gap proportions may deviate from a recorded pattern (0.35 = 35%)

[knock_pattern lights]
count: 2
gcode: _KNOCK_TOGGLE_LIGHTS

[gcode_macro _KNOCK_TOGGLE_LIGHTS]
gcode:
  {% set on = printer['led case'].color_data[0][3] > 0 %}
  SET_LED LED=case WHITE={0 if on else 1}
  SET_LED LED=hotend WHITE={0 if on else 1}
  RESPOND MSG="knock: lights {'off' if on else 'on'}"
